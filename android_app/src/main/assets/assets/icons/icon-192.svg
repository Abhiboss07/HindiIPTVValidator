<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#0284c7" flood-opacity="0.6"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="4"/>
  <!-- 3D Play Symbol & Radio Waves -->
  <g filter="url(#shadow)" transform="translate(40, 20)">
    <!-- Radio Waves -->
    <path d="M 120 190 A 120 120 0 0 1 312 190" fill="none" stroke="url(#glow)" stroke-width="18" stroke-linecap="round" opacity="0.4"/>
    <path d="M 150 215 A 80 80 0 0 1 282 215" fill="none" stroke="url(#glow)" stroke-width="18" stroke-linecap="round" opacity="0.8"/>
    <!-- TV Screen / Play Polygon -->
    <path d="M 170 170 L 310 250 L 170 330 Z" fill="url(#glow)"/>
    <!-- Live Badge Dot -->
    <circle cx="310" cy="140" r="16" fill="#ef4444"/>
    <circle cx="310" cy="140" r="28" fill="none" stroke="#ef4444" stroke-width="4" opacity="0.6"/>
  </g>
  <!-- Text Label -->
  <text x="256" y="440" font-family="-apple-system, system-ui, sans-serif" font-size="42" font-weight="900" fill="#f8fafc" text-anchor="middle" letter-spacing="4">AAKASH</text>
</svg>