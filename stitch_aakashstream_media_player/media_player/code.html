<style>
        .player-controls {
            opacity: 1;
            transition: opacity 0.3s ease;
        }
        .player-idle .player-controls {
            opacity: 0;
            pointer-events: none;
        }
        .player-idle .player-overlay {
            opacity: 0;
        }
        .player-overlay {
            transition: opacity 0.3s ease;
            background: linear-gradient(to top, rgba(10, 10, 10, 0.9) 0%, rgba(10, 10, 10, 0.4) 50%, rgba(10, 10, 10, 0.1) 100%);
        }
    </style>

<body class="bg-background text-on-background antialiased h-screen w-screen overflow-hidden flex flex-col relative" id="player-container">
<!-- Top Navigation Shell (Hidden intentionally for full screen media, but keeping structural rules from JSON if needed. For media player, usually suppressed) -->
<!-- Suppressed navigation shell due to contextual state (transactional/linear flow of watching media) -->
<!-- Main Player Area -->
<main class="flex-grow relative h-full w-full">
<!-- Media Background Image Placeholder -->
<div class="absolute inset-0 w-full h-full bg-surface-container-lowest">
<img alt="Media Background" class="w-full h-full object-cover object-center" data-alt="A sweeping, cinematic landscape shot of a dark, misty forest at twilight. The lighting is moody and low-key, with subtle moonlight filtering through dense pine trees. The color palette consists of deep charcoal, almost pure black shadows, and muted, sophisticated emerald green accents. The overall aesthetic is calm, premium, and highly atmospheric, suitable for a sophisticated dark-mode media player background." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCs9sGG3n4GQKLfuEXv3bmSYp6kG0Lqkp9ncM0x6fxjHcfRJFoTMvAeKxoPipq_dCMEMovCdPGP9LQUIAdgyAY8j-tF5gIK55vl81PI1-xzib1iU0p_BLPgzQ7Bh3hACt8a1SQztr03JZMM6ZhBW2K5zX6QYNZXwljRCu7nv4xNRu1U8O53w90pCyvM3lBpZeYyHixhxpULLBb-Td_BdbTHwjiXQcPrCviOqbjhZE9aggjFTfEBsoeA"/>
</div>
<!-- Dark Overlay -->
<div class="absolute inset-0 player-overlay pointer-events-none"></div>
<!-- Top Actions (Back, Cast, More) -->
<div class="absolute top-0 left-0 right-0 p-margin-mobile md:p-margin-desktop flex justify-between items-center z-10 player-controls">
<button aria-label="Close" class="text-on-surface hover:text-primary transition-colors flex items-center justify-center w-xl h-xl active:scale-95 duration-150">
<span class="material-symbols-outlined" style="font-size: 28px;">close</span>
</button>
<div class="flex gap-md">
<button aria-label="Cast" class="text-on-surface hover:text-primary transition-colors flex items-center justify-center w-xl h-xl active:scale-95 duration-150">
<span class="material-symbols-outlined" style="font-size: 24px;">cast</span>
</button>
<button aria-label="More options" class="text-on-surface hover:text-primary transition-colors flex items-center justify-center w-xl h-xl active:scale-95 duration-150">
<span class="material-symbols-outlined" style="font-size: 24px;">more_vert</span>
</button>
</div>
</div>
<!-- Bottom Controls Area -->
<div class="absolute bottom-0 left-0 right-0 p-margin-mobile md:p-margin-desktop z-10 flex flex-col gap-lg player-controls">
<!-- Metadata -->
<div class="flex flex-col gap-xs mb-sm">
<h1 class="font-headline-md text-headline-md text-on-surface tracking-tight">The Midnight Horizon</h1>
<p class="font-body-md text-body-md text-on-surface-variant">S1:E4 • The Silent Echo</p>
</div>
<!-- Progress Bar -->
<div class="flex flex-col gap-sm w-full group cursor-pointer">
<div class="flex justify-between items-center font-label-sm text-label-sm text-on-surface-variant">
<span>24:12</span>
<span>58:45</span>
</div>
<div class="relative w-full h-[4px] bg-[#2B3A36] rounded-full overflow-hidden">
<div class="absolute top-0 left-0 h-full bg-[#4F7C73] rounded-full" style="width: 42%;"></div>
</div>
</div>
<!-- Playback Controls -->
<div class="flex justify-between items-center mt-sm">
<!-- Left Controls (Volume, Subtitles) -->
<div class="flex items-center gap-md md:gap-lg w-1/3">
<button aria-label="Volume" class="text-on-surface hover:text-primary transition-colors flex items-center justify-center w-xl h-xl active:scale-95 duration-150 hidden md:flex">
<span class="material-symbols-outlined" style="font-size: 24px;">volume_up</span>
</button>
<button aria-label="Subtitles" class="text-on-surface hover:text-primary transition-colors flex items-center justify-center w-xl h-xl active:scale-95 duration-150">
<span class="material-symbols-outlined" style="font-size: 24px;">subtitles</span>
</button>
</div>
<!-- Center Controls (Main Playback) -->
<div class="flex items-center justify-center gap-md md:gap-xl w-1/3">
<button aria-label="Rewind 10 seconds" class="text-on-surface hover:text-primary transition-colors flex items-center justify-center w-xl h-xl active:scale-95 duration-150">
<span class="material-symbols-outlined" style="font-size: 28px;">replay_10</span>
</button>
<button aria-label="Pause" class="bg-primary text-primary-container rounded-full flex items-center justify-center w-xxl h-xxl hover:bg-surface-tint transition-colors active:scale-95 duration-150">
<span class="material-symbols-outlined" style="font-size: 36px; font-variation-settings: 'FILL' 1;">pause</span>
</button>
<button aria-label="Forward 10 seconds" class="text-on-surface hover:text-primary transition-colors flex items-center justify-center w-xl h-xl active:scale-95 duration-150">
<span class="material-symbols-outlined" style="font-size: 28px;">forward_10</span>
</button>
</div>

<span class="material-symbols-outlined" style="font-size: 24px;">skip_next</span>
</button>
<button aria-label="Fullscreen" class="text-on-surface hover:text-primary transition-colors flex items-center justify-center w-xl h-xl active:scale-95 duration-150 hidden md:flex">
<span class="material-symbols-outlined" style="font-size: 24px;">fullscreen</span>
</button>
</div>
</div>
</div>
</main>
<script>
        // Simple idle timeout script for media player
        document.addEventListener('DOMContentLoaded', () => {
            let timeout;
            const container = document.getElementById('player-container');
            
            function resetTimer() {
                container.classList.remove('player-idle');
                clearTimeout(timeout);
                // Hide controls after 3 seconds of inactivity
                timeout = setTimeout(() => {
                    container.classList.add('player-idle');
                }, 3000);
            }

            // Listen for mouse/touch events to show controls
            container.addEventListener('mousemove', resetTimer);
            container.addEventListener('touchstart', resetTimer);
            container.addEventListener('click', resetTimer);
            container.addEventListener('keydown', resetTimer);

            // Initial timer setup
            resetTimer();
        });
    </script>
</body></html>
