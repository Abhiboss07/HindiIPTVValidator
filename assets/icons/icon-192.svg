<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="t2lBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F0C1B"/>
      <stop offset="50%" stop-color="#191128"/>
      <stop offset="100%" stop-color="#0A0612"/>
    </linearGradient>
    <linearGradient id="t2lRuby" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3366"/>
      <stop offset="50%" stop-color="#E50914"/>
      <stop offset="100%" stop-color="#990000"/>
    </linearGradient>
    <linearGradient id="t2lSilver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#C0C5D0"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#E50914" flood-opacity="0.75"/>
    </filter>
  </defs>
  <!-- Background Body with glowing border -->
  <rect width="512" height="512" rx="128" fill="url(#t2lBg)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="url(#t2lRuby)" stroke-width="4" stroke-opacity="0.4"/>
  
  <!-- Holographic Center Glow -->
  <circle cx="256" cy="240" r="140" fill="#E50914" opacity="0.18" filter="url(#neonGlow)"/>

  <!-- T2L Modern Geometric Insignia -->
  <g filter="url(#neonGlow)" transform="translate(0, 20)">
    <!-- Letter T -->
    <path d="M 90 140 L 200 140 L 200 180 L 165 180 L 165 290 L 125 290 L 125 180 L 90 180 Z" fill="url(#t2lSilver)"/>
    
    <!-- Number 2 (High-Energy Ruby Gradient) -->
    <path d="M 215 140 L 305 140 L 305 200 L 255 245 L 305 245 L 305 290 L 215 290 L 215 240 L 265 185 L 215 185 Z" fill="url(#t2lRuby)"/>
    
    <!-- Letter L -->
    <path d="M 320 140 L 360 140 L 360 250 L 420 250 L 420 290 L 320 290 Z" fill="url(#t2lSilver)"/>
  </g>

  <!-- Tagline Text -->
  <text x="256" y="425" font-family="-apple-system, system-ui, sans-serif" font-size="22" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="6">TELEVISION TO LIVE</text>
  <text x="256" y="455" font-family="-apple-system, system-ui, sans-serif" font-size="13" font-weight="700" fill="#FF3366" text-anchor="middle" letter-spacing="4">ULTRA HD STREAMING</text>
</svg>